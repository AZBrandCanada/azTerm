[package]
name = "azterm"
version = "0.1.5"
edition = "2021"
description = "Fast, modern native cross-platform terminal, SSH profile manager, and SFTP client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AZBrandCanada/azTerm"

[dependencies]
eframe = { version = "0.28", default-features = true }
portable-pty = "0.8"
vt100 = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = { version = "3.4", features = ["wayland-data-control"] }

[package.metadata.deb]
name = "azterm"
maintainer = "AZBrandCanada Developers"
copyright = "2026 AZBrandCanada"
license-file = ["LICENSE", "4"]
extended-description = "A fast, lightweight GPU-accelerated terminal emulator, SSH bookmark manager, and SFTP client written in pure Rust."
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/azterm", "usr/bin/azterm", "755"],
    ["assets/azterm.desktop", "usr/share/applications/azterm.desktop", "644"],
    ["assets/azterm.svg", "usr/share/icons/hicolor/scalable/apps/azterm.svg", "644"],
    ["assets/servicemenus/azterm_open.desktop", "usr/share/kio/servicemenus/azterm_open.desktop", "755"],
]
