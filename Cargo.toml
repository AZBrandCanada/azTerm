[package]
name = "azterm"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", default-features = true }
portable-pty = "0.8"
vt100 = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3.4"
