name: Release Builds

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux Packages (.AppImage, .deb, .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev pkg-config curl

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Restores from the main-branch cache on every run.
      # Only writes back when running on main, so tags don't
      # spawn their own unreachable per-tag caches.
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build All Linux Packages
        # Only do the packaging work on tag pushes. On main pushes we
        # just want to compile once so the cache gets populated.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist target/stage-linux target/AppDir/usr/bin target/AppDir/usr/lib target/AppDir/usr/share/applications target/AppDir/usr/share/icons/hicolor/scalable/apps target/AppDir/usr/share/icons/hicolor/256x256/apps

          # 1. Compile Release Binary
          cargo build --release

          # 2. Build .deb Package (version pulled from the git tag)
          cargo deb -o "dist/azterm_${GITHUB_REF_NAME#v}_amd64.deb"

          # 3. Build Tarball
          cp target/release/azterm target/stage-linux/
          cp assets/azterm.desktop target/stage-linux/
          cp assets/azterm.svg target/stage-linux/
          tar -czf dist/azterm-linux-x86_64.tar.gz -C target/stage-linux .

          # 4. Build AppImage & Bundle xkbcommon Shared Libraries
          cp target/release/azterm target/AppDir/usr/bin/azterm
          cp -d /usr/lib/x86_64-linux-gnu/libxkbcommon*.so* target/AppDir/usr/lib/

          cp assets/azterm.desktop target/AppDir/azterm.desktop
          cp assets/azterm.desktop target/AppDir/usr/share/applications/azterm.desktop
          cp assets/azterm.svg target/AppDir/azterm.svg
          cp assets/azterm.svg target/AppDir/usr/share/icons/hicolor/scalable/apps/azterm.svg

          printf '#!/bin/sh\nSELF=$(readlink -f "$0")\nHERE=${SELF%%/*}\nexport PATH="${HERE}/usr/bin:${PATH}"\nexport LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"\nexec "${HERE}/usr/bin/azterm" "$@"\n' > target/AppDir/AppRun
          chmod +x target/AppDir/AppRun

          curl -sLo target/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x target/appimagetool
          ARCH=x86_64 ./target/appimagetool --appimage-extract-and-run target/AppDir dist/AZTerm-x86_64.AppImage

      - name: Warm cache on main
        # On main pushes, just compile so the cache gets populated.
        # No packaging, no artifacts — this exists only to seed the
        # default-branch cache that tag builds will restore from.
        if: github.ref == 'refs/heads/main'
        run: cargo build --release

      - name: Upload Linux Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AZTerm-x86_64.AppImage
            dist/azterm_*_amd64.deb
            dist/azterm-linux-x86_64.tar.gz

  build-macos:
    name: macOS Package (.tar.gz)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build macOS Binary
        run: cargo build --release

      - name: Package macOS Tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          tar -czf dist/azterm-macos-universal.tar.gz -C target/release azterm

      - name: Upload macOS Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/azterm-macos-universal.tar.gz